[build-system]
build-backend = "setuptools.build_meta"
requires = [
    "setuptools~=80.9",
]

[project]
authors = [
    { name="Edin Tarić", email="unicorn@regrow.earth" },
]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "docopt==0.6.2",
    "matplotlib~=3.10.7",
    "robotframework~=7.3",
]
dynamic = [ "version" ]
description = "Execute Robot Framework suites in parallel"
keywords = [ "robot", "parallel", "robotframework", "async", "test", "runner" ]
license = "Apache-2.0"
name = "robotframework-medusa"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# Install with `pip3 install -e '.[dev]'
dev = [
    "mypy~=2.0",  # Static type checker
    "pytest~=9.0",  # Unit tests
    "ruff~=0.16.4",  # Python linter and formatter
    "robotframework-robocop~=8.8",  # Robot linter and formatter
]

[project.urls]
Repository = "https://github.com/insys-icom/medusa"

[project.scripts]
medusa = "medusa.main:main"

[tool.pytest]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
extend-select = [ "I" ]  # import sorting

[tool.setuptools.dynamic]
version = { attr = "medusa.__version__" }
